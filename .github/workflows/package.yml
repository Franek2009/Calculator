name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3

jobs:
  package-qt-sources:
    runs-on: ubuntu-24.04

    steps:
      - name: Download and verify Qt corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/Calculator-Qt-sources-${QT_VERSION}"
          base_url="https://download.qt.io/official_releases/qt/6.8/${QT_VERSION}/submodules"
          mkdir -p "$source_dir"
          cd "$source_dir"

          curl --fail --location --retry 3 --remote-name \
            "$base_url/qtbase-everywhere-src-${QT_VERSION}.tar.xz"
          curl --fail --location --retry 3 --remote-name \
            "$base_url/qtsvg-everywhere-src-${QT_VERSION}.tar.xz"

          cat > SHA256SUMS <<'EOF'
          56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80  qtbase-everywhere-src-6.8.3.tar.xz
          35eb516460f00f264eb504baa253432384351cf23fb9980a5857190e8deef438  qtsvg-everywhere-src-6.8.3.tar.xz
          EOF
          sha256sum --check SHA256SUMS

      - name: Upload Qt corresponding-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Qt-sources-6.8.3
          path: ${{ runner.temp }}/Calculator-Qt-sources-6.8.3
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils ninja-build xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCALCULATOR_DEPLOY_QT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Install deployable application
        run: >-
          cmake --install build
          --prefix "$GITHUB_WORKSPACE/package/Calculator-linux-x86_64-ubuntu-24.04"

      - name: Include third-party notices
        shell: bash
        run: |
          qt_licenses="$GITHUB_WORKSPACE/third_party/qt"
          icu_license="$GITHUB_WORKSPACE/third_party/icu/LICENSE.txt"
          platform_notice="$GITHUB_WORKSPACE/third_party/notices/linux/THIRD-PARTY-NOTICES.md"
          package_licenses="package/Calculator-linux-x86_64-ubuntu-24.04/licenses"
          test -d "$qt_licenses"
          test -f "$icu_license"
          test -f "$platform_notice"
          mkdir -p "$package_licenses/Qt" "$package_licenses/ICU"
          cp -R "$qt_licenses"/. "$package_licenses/Qt"/
          cp "$icu_license" "$package_licenses/ICU/LICENSE.txt"
          cp "$platform_notice" "$package_licenses/THIRD-PARTY-NOTICES.md"

      - name: Validate Linux package
        shell: bash
        run: |
          set -euo pipefail
          package_root="$GITHUB_WORKSPACE/package/Calculator-linux-x86_64-ubuntu-24.04"
          executable="$package_root/bin/Calculator"
          platform_plugin="$package_root/plugins/platforms/libqxcb.so"

          test -x "$executable"
          test -f "$package_root/bin/qt.conf"
          test -f "$platform_plugin"
          compgen -G "$package_root/lib/libQt6Core.so*" > /dev/null
          compgen -G "$package_root/lib/libQt6Gui.so*" > /dev/null
          compgen -G "$package_root/lib/libQt6Widgets.so*" > /dev/null

          dependency_report="$RUNNER_TEMP/calculator-linux-dependencies.txt"
          : > "$dependency_report"
          while IFS= read -r -d '' binary; do
            printf '\n%s\n' "$binary" >> "$dependency_report"
            env -u LD_LIBRARY_PATH ldd "$binary" >> "$dependency_report"
          done < <(find "$package_root" -type f \( -name Calculator -o -name '*.so' -o -name '*.so.*' \) -print0)
          cat "$dependency_report"
          if grep -F "not found" "$dependency_report"; then
            exit 1
          fi
          if grep -F "$QT_ROOT_DIR" "$dependency_report"; then
            echo "Packaged dependencies must not resolve from the Qt SDK" >&2
            exit 1
          fi

          executable_dependencies="$(env -u LD_LIBRARY_PATH ldd "$executable")"
          printf '%s\n' "$executable_dependencies"
          canonical_lib_dir="$(realpath "$package_root/lib")"
          for dependency in libQt6Core.so.6 libQt6Gui.so.6 libQt6Widgets.so.6; do
            resolved_path="$(printf '%s\n' "$executable_dependencies" |
              awk -v dependency="$dependency" \
                '$1 == dependency && $2 == "=>" { print $3; exit }')"
            if [ -z "$resolved_path" ]; then
              echo "Required dependency was not resolved: $dependency" >&2
              exit 1
            fi
            if ! canonical_path="$(realpath "$resolved_path")"; then
              echo "Could not canonicalize $dependency path: $resolved_path" >&2
              exit 1
            fi
            case "$canonical_path" in
              "$canonical_lib_dir"/*) ;;
              *)
                echo "$dependency resolved outside the package: $canonical_path" >&2
                exit 1
                ;;
            esac
          done

          executable_dynamic="$(readelf -d "$executable")"
          plugin_dynamic="$(readelf -d "$platform_plugin")"
          printf '%s\n' "$executable_dynamic"
          printf '%s\n' "$plugin_dynamic"
          printf '%s\n' "$executable_dynamic" | grep -F '$ORIGIN/../lib'
          printf '%s\n' "$plugin_dynamic" | grep -F '$ORIGIN/../../lib'

          if find "$package_root" -type f -iname '*Tests*' | grep -q .; then
            echo "Test binaries must not be present in the package" >&2
            exit 1
          fi

          set +e
          env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=xcb xvfb-run --auto-servernum \
            timeout 5s "$executable"
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 124 ]; then
            echo "Packaged application failed its offscreen smoke test" >&2
            exit 1
          fi

      - name: Create Linux archive
        run: >-
          tar -C package -czf Calculator-linux-x86_64-ubuntu-24.04.tar.gz
          Calculator-linux-x86_64-ubuntu-24.04

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-linux-x86_64-ubuntu-24.04
          path: Calculator-linux-x86_64-ubuntu-24.04.tar.gz
          if-no-files-found: error

  package-windows:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: false

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DBUILD_TESTING=OFF
          -DCALCULATOR_DEPLOY_QT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install deployable application
        shell: pwsh
        run: |
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE "package/Calculator-windows-x86_64"
          cmake --install build --config Release --prefix "$installPrefix"

      - name: Include third-party notices
        shell: pwsh
        run: |
          $licenseRoot = Join-Path $env:GITHUB_WORKSPACE "third_party"
          $packageLicenses = "package/Calculator-windows-x86_64/licenses"
          $requiredSources = @(
            (Join-Path $licenseRoot "qt"),
            (Join-Path $licenseRoot "mesa"),
            (Join-Path $licenseRoot "microsoft/NOTICE.md"),
            (Join-Path $licenseRoot "notices/windows/THIRD-PARTY-NOTICES.md")
          )
          foreach ($source in $requiredSources) {
            if (-not (Test-Path $source)) {
              throw "Third-party notice source was not found: $source"
            }
          }
          New-Item -ItemType Directory -Force -Path $packageLicenses | Out-Null
          Copy-Item -Recurse -Force (Join-Path $licenseRoot "qt") `
            (Join-Path $packageLicenses "Qt")
          Copy-Item -Recurse -Force (Join-Path $licenseRoot "mesa") `
            (Join-Path $packageLicenses "Mesa")
          New-Item -ItemType Directory -Force `
            -Path (Join-Path $packageLicenses "Microsoft") | Out-Null
          Copy-Item -Force (Join-Path $licenseRoot "microsoft/NOTICE.md") `
            (Join-Path $packageLicenses "Microsoft/NOTICE.md")
          Copy-Item -Force `
            (Join-Path $licenseRoot "notices/windows/THIRD-PARTY-NOTICES.md") `
            (Join-Path $packageLicenses "THIRD-PARTY-NOTICES.md")

      - name: Validate Windows package
        shell: pwsh
        run: |
          $packageRoot = (Resolve-Path "package/Calculator-windows-x86_64").Path
          $binDirectory = Join-Path $packageRoot "bin"
          $executable = Join-Path $binDirectory "Calculator.exe"

          $requiredFiles = @(
            $executable,
            (Join-Path $binDirectory "Qt6Core.dll"),
            (Join-Path $binDirectory "Qt6Gui.dll"),
            (Join-Path $binDirectory "Qt6Widgets.dll"),
            (Join-Path $packageRoot "plugins/platforms/qwindows.dll")
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required deployed file is missing: $file"
            }
          }

          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -property installationPath
          Import-Module "$vsInstall/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation
          dumpbin /DEPENDENTS $executable

          $testFiles = Get-ChildItem $packageRoot -Recurse -File |
            Where-Object { $_.Name -match "Tests" }
          if ($testFiles) {
            throw "Test binaries must not be present in the package"
          }

          $savedPath = $env:PATH
          try {
            $env:PATH = "$binDirectory;$env:SystemRoot;$env:SystemRoot/System32"
            $process = Start-Process -FilePath $executable -PassThru
            Start-Sleep -Seconds 3
            if ($process.HasExited) {
              throw "Packaged application exited during its smoke test"
            }
            Stop-Process -Id $process.Id -Force
          }
          finally {
            $env:PATH = $savedPath
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-windows-x86_64
          path: package/Calculator-windows-x86_64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-windows, package-qt-sources]
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Calculator-linux-x86_64-ubuntu-24.04
          path: release-input/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Calculator-windows-x86_64
          path: release-input/windows

      - name: Download Qt corresponding-source artifact
        uses: actions/download-artifact@v4
        with:
          name: Calculator-Qt-sources-6.8.3
          path: release-input/qt-sources

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$assets_dir"

          cp release-input/linux/Calculator-linux-x86_64-ubuntu-24.04.tar.gz \
            "$assets_dir/Calculator-${tag}-linux-x86_64-ubuntu-24.04.tar.gz"

          (
            cd release-input/windows
            zip -r \
              "$assets_dir/Calculator-${tag}-windows-x86_64.zip" .
          )

          tar -C release-input/qt-sources -czf \
            "$assets_dir/Calculator-Qt-sources-${QT_VERSION}.tar.gz" .

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "Calculator $tag" \
              --generate-notes
          fi
